name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # A versão vem do global.json; sem ele o runner usava o SDK mais novo da imagem
      # (10.x) em vez do 8.0 com que o projeto é compilado localmente.
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore RadminStreamLive.sln

      - name: Compilar (Release)
        run: dotnet build RadminStreamLive.sln -c Release --no-restore
